project_id = "ai-quiz-studio"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://localhost:5173", "https://ant2108.github.io/ai-quiz-studio"]

[functions.process-document]
verify_jwt = true

[functions.generate-quiz]
verify_jwt = true

[functions.start-attempt]
verify_jwt = true

[functions.answer-question]
verify_jwt = true

[functions.submit-attempt]
verify_jwt = true

[functions.get-attempt-review]
verify_jwt = true

[functions.moderate-quiz]
verify_jwt = true
