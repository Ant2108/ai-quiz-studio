<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>AI Quiz Studio</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages (SPA 404 Redirect)
      // Keeps pathDepth = 1 for project pages (https://<user>.github.io/ai-quiz-studio/)
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
