<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="aqs-bg" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2A302E" />
      <stop offset="100%" stop-color="#171B1A" />
    </linearGradient>
    <linearGradient id="aqs-mint" x1="14" y1="14" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C8FFEE" />
      <stop offset="55%" stop-color="#B0FDE0" />
      <stop offset="100%" stop-color="#4ADEB8" />
    </linearGradient>
    <linearGradient id="aqs-spark" x1="42" y1="8" x2="56" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#B0FDE0" />
    </linearGradient>
  </defs>

  <!-- Iconic Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#aqs-bg)" />
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="15.25" stroke="#B0FDE0" stroke-opacity="0.22" stroke-width="1.5" />

  <!-- Geometric Q Ring (open slightly at top-right for AI Spark) -->
  <path
    d="M34.5 14.5C24.28 13.7 15.5 21.75 15.5 32C15.5 41.66 23.34 49.5 33 49.5C42.66 49.5 50.5 41.66 50.5 32C50.5 30.8 50.38 29.62 50.14 28.48"
    stroke="url(#aqs-mint)"
    stroke-width="6.2"
    stroke-linecap="round"
  />

  <!-- Quiz Checkmark flowing into the Q Tail -->
  <path
    d="M25.5 32.5L31.2 38.2L40.5 27.5"
    stroke="#FFFFFF"
    stroke-width="4.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M41.5 41.5L50.5 50.5"
    stroke="url(#aqs-mint)"
    stroke-width="6.2"
    stroke-linecap="round"
  />

  <!-- 4-Point AI Spark Star -->
  <path
    d="M47.5 9.5C48.1 13.8 49.7 15.4 54 16C49.7 16.6 48.1 18.2 47.5 22.5C46.9 18.2 45.3 16.6 41 16C45.3 15.4 46.9 13.8 47.5 9.5Z"
    fill="url(#aqs-spark)"
  />
</svg>
